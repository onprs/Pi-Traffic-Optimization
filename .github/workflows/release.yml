name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 校验 tag、版本与发布说明
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag 指向的提交不在 main 分支"; exit 1; }
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          echo "npm $(npm --version)"

      - run: npm ci

      - name: 发布到 npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 已存在于 npm，跳过发布"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN" --location=user
            npm publish --access public --tag "$tag" --provenance
          else
            npm publish --access public --tag "$tag"
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME 已存在，跳过创建"
            exit 0
          fi
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease
